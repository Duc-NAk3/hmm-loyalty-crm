# nginx trong container frontend: phục vụ file tĩnh của React và chuyển /api sang backend
# (thay cho proxy của Vite khi chạy npm run dev)
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Gọi API: chuyển sang container backend (tên dịch vụ trong docker-compose.yml)
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        client_max_body_size 10m;   # tải file CSV khi chuyển đổi dữ liệu
    }

    # Ứng dụng React một trang: đường dẫn như /pos, /portal/dashboard đều trả về index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
