# Cấu hình chạy local. Mật khẩu CSDL đặt trong file backend/local.properties (không đưa lên git), ví dụ:
#   DB_PASSWORD=matkhau_postgres_cua_ban
spring:
  application:
    name: hmm-loyalty
  config:
    import: optional:file:./local.properties
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:hmm_loyalty}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
  flyway:
    locations: classpath:db/migration
  # ORM: Spring Data JPA (Hibernate). Flyway quản lý schema; Hibernate chỉ kiểm tra entity khớp bảng.
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          batch_size: 500
          time_zone: Asia/Ho_Chi_Minh
        order_inserts: true
        order_updates: true
        # pooled-lo: nextval trả về đầu khối 50 ID → không trùng ID cũ khi sequence đổi bước nhảy (V2)
        id:
          optimizer:
            pooled:
              preferred: pooled-lo
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  jackson:
    time-zone: Asia/Ho_Chi_Minh

server:
  port: ${PORT:8080}

app:
  jwt-secret: ${JWT_SECRET:hmm-demo-secret-key-please-change-0123456789abcdef}
  jwt-hours: 12
  otp-store: memory          # memory | redis (profile docker)
  seed-demo-data: true       # tạo dữ liệu mẫu khi CSDL còn trống
  cors-origins: http://localhost:5173

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    vn.sofitech.hmm: INFO
